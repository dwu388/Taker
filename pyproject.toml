[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profit-taker"
version = "0.24.0"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3",
  "lightgbm>=4.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyautogui>=0.9.54",
  "pyperclip>=1.8",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "xgboost>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
